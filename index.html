<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b4f8a">
<title>Grow, Fish, Grow!</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--font:"Comic Sans MS","Comic Neue","Chalkboard SE","Andika","Trebuchet MS",Verdana,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#0b4f8a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,40,80,.45);overflow:auto;touch-action:pan-y;padding:14px;box-sizing:border-box;z-index:10}
.panel{background:#fffdf5;border:6px solid #ffd54f;border-radius:28px;padding:14px 26px;text-align:center;max-width:760px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2);margin:auto;box-sizing:border-box}
h1{font-size:clamp(32px,6vw,56px);margin:4px 0;color:#0d5ea8}
h2{font-size:clamp(28px,5vw,46px);margin:4px 0;color:#e65100}
p{font-size:clamp(22px,3.6vw,32px);margin:6px 0;color:#16324f}
.w{cursor:pointer;border-radius:8px;padding:0 2px;transition:background .15s}
.pop{background:#fff176!important}
.spk{border:none;background:#e3f2fd;border-radius:50%;width:1.5em;height:1.5em;font-size:.7em;vertical-align:middle;margin-right:.35em;cursor:pointer;padding:0}
.btn{font-family:inherit;font-size:clamp(24px,4vw,34px);font-weight:bold;border:none;border-radius:20px;padding:10px 28px;margin:8px;background:#4fc3f7;color:#fff;box-shadow:0 6px 0 #0277bd;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0277bd}
.btn.go{background:#66bb6a;box-shadow:0 6px 0 #2e7d32}
.btn.go:active{box-shadow:0 2px 0 #2e7d32}
.art{max-height:26vh;max-width:70vw;width:auto;height:auto}
.link{background:none;border:none;color:#607d8b;font-family:inherit;font-size:20px;text-decoration:underline;cursor:pointer}
.hint{font-size:18px;color:#607d8b}
.glow-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#8cff96;box-shadow:0 0 10px 4px #8cff96;margin-right:.45em;vertical-align:middle}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;pointer-events:none;z-index:4;box-sizing:border-box}
#hud canvas{width:60px;height:40px}
#stageName{color:#fff;font-size:28px;font-weight:bold;text-shadow:0 2px 0 #0a3a66,0 0 6px #0a3a66;pointer-events:auto;cursor:pointer;white-space:nowrap}
.bar{flex:1;min-width:80px;height:24px;background:rgba(255,255,255,.3);border:3px solid #fff;border-radius:16px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(#ffe36e,#ffb300);border-radius:12px;transition:width .25s}
#trophy{font-size:32px}
.hbtn{pointer-events:auto;width:52px;height:52px;flex:none;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.3);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hbtn.off{opacity:.4}
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:#fffdf5;border:5px solid #ff7043;border-radius:22px;padding:4px 18px;display:flex;align-items:center;gap:10px;font-size:30px;font-weight:bold;color:#bf360c;z-index:5;transition:opacity .3s,transform .3s;cursor:pointer;white-space:nowrap}
#toast canvas{width:72px;height:48px}
#toast.hide{opacity:0;transform:translate(-50%,-20px);pointer-events:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:8px 0}
.card{background:#e1f5fe;border-radius:16px;padding:4px;border:3px solid #81d4fa;cursor:pointer}
.card.locked{background:#cfd8dc;border-color:#b0bec5;cursor:default}
.card canvas{width:100%;height:auto;display:block}
.card .lab{font-size:21px;font-weight:bold;color:#0d47a1}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <canvas id="curIcon" width="120" height="80"></canvas>
  <span id="stageName" class="say"></span>
  <div class="bar"><div id="fill"></div></div>
  <canvas id="nextIcon" width="120" height="80"></canvas>
  <span id="trophy" class="hidden">🏆</span>
  <button id="bBook" class="hbtn" title="Fish book">📖</button>
  <button id="bRead" class="hbtn" title="Read to me">🗣️</button>
  <button id="bSound" class="hbtn" title="Sound">🔊</button>
</div>

<div id="toast" class="hide say"><canvas id="toastIcon" width="144" height="96"></canvas><span id="toastText"></span></div>

<div id="title" class="overlay">
  <div class="panel">
    <h1 class="sentence" data-text="Grow, Fish, Grow!"></h1>
    <canvas id="titleArt" class="art" width="420" height="220"></canvas>
    <p class="sentence" data-text="Eat the small fish."></p>
    <p class="sentence" data-text="Big fish go boing!"></p>
    <p><span class="glow-dot"></span><span class="sentence" data-text="Green fish are yum!"></span></p>
    <div><button id="playBtn" class="btn go">Play</button><button id="bookBtn" class="btn">📖 Fish Book</button></div>
    <button id="newBtn" class="link hidden">Start over</button>
    <div class="hint">Tap a word to hear it.</div>
  </div>
</div>

<div id="evolve" class="overlay hidden">
  <div class="panel">
    <h1 class="sentence" data-text="You grew!"></h1>
    <canvas id="evoArt" class="art" width="420" height="260"></canvas>
    <h2 id="evoText"></h2>
    <button id="goBtn" class="btn go">Go!</button>
  </div>
</div>

<div id="win" class="overlay hidden">
  <div class="panel">
    <h1 class="sentence" data-text="You did it!"></h1>
    <canvas id="winArt" class="art" width="420" height="260"></canvas>
    <h2 class="sentence" data-text="You are the biggest in the sea!"></h2>
    <div><button id="againBtn" class="btn go">Play again</button><button id="winBookBtn" class="btn">📖 Fish Book</button></div>
  </div>
</div>

<div id="book" class="overlay hidden">
  <div class="panel">
    <h1 class="sentence" data-text="My Fish Book"></h1>
    <p id="bookCount"></p>
    <div id="grid"></div>
    <button id="backBtn" class="btn go">Back</button>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const FONT = '"Comic Sans MS","Comic Neue","Chalkboard SE","Trebuchet MS",Verdana,sans-serif';
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- Creatures ----------
const SPECIES = {
  shrimp:     { name: 'shrimp',      kind: 'shrimp',  col: '#ff8a65' },
  minnow:     { name: 'minnow',      kind: 'fish',    col: '#9ccc65', slim: true },
  redfish:    { name: 'red fish',    kind: 'fish',    col: '#ef5350' },
  bluefish:   { name: 'blue fish',   kind: 'fish',    col: '#42a5f5' },
  yellowfish: { name: 'yellow fish', kind: 'fish',    col: '#ffd54f' },
  purplefish: { name: 'purple fish', kind: 'fish',    col: '#ba68c8' },
  clownfish:  { name: 'clownfish',   kind: 'fish',    col: '#ff9800', stripes: true },
  jelly:      { name: 'jellyfish',   kind: 'jelly',   col: '#f48fb1' },
  puffer:     { name: 'puffer fish', kind: 'puffer',  col: '#ffee58' },
  turtle:     { name: 'turtle',      kind: 'turtle',  col: '#43a047' },
  dolphin:    { name: 'dolphin',     kind: 'dolphin', col: '#78a6c8' },
  whale:      { name: 'whale',       kind: 'whale',   col: '#5c6bc0' },
  bigwhale:   { name: 'big whale',   kind: 'whale',   col: '#8e7cc3' },
};
const BOOK = ['shrimp','minnow','redfish','bluefish','yellowfish','purplefish','clownfish','jelly','puffer','turtle','dolphin','whale','bigwhale'];
const STAGES = [
  { sp: 'minnow', base: 10 }, { sp: 'clownfish', base: 20 }, { sp: 'turtle', base: 40 },
  { sp: 'dolphin', base: 80 }, { sp: 'whale', base: 160 }
];
const MAX_SIZE = 320;   // whale must reach this to win
const EAT = 0.92;       // can eat anything smaller than 92% of your size
const YUM = ['Yum!', 'Yum yum!', 'Good!', 'Nice!', 'Wow!', 'Munch!', 'Yay!'];

function pickSpecies(s) {
  if (s < 9)   return pick(['shrimp', 'shrimp', 'minnow']);
  if (s < 18)  return pick(['minnow', 'redfish', 'bluefish', 'yellowfish', 'purplefish', 'shrimp']);
  if (s < 34)  return pick(['clownfish', 'jelly', 'redfish', 'bluefish', 'yellowfish', 'purplefish', 'puffer']);
  if (s < 65)  return pick(['puffer', 'jelly', 'turtle', 'clownfish']);
  if (s < 130) return pick(['turtle', 'dolphin', 'puffer']);
  if (s < 260) return pick(['dolphin', 'whale', 'turtle']);
  return pick(['whale', 'bigwhale', 'dolphin']);
}

const shadeCache = {};
function shade(hex, amt) {
  const k = hex + amt; if (shadeCache[k]) return shadeCache[k];
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return shadeCache[k] = `rgb(${r},${g},${b})`;
}

// ---------- Drawing ----------
const OUT = '#1d2b44';
function fs(c, fill, r) { c.fillStyle = fill; c.fill(); c.lineWidth = r * 0.07; c.strokeStyle = OUT; c.stroke(); }
function eye(c, x, y, s) {
  c.beginPath(); c.arc(x, y, s, 0, TAU); c.fillStyle = '#fff'; c.fill();
  c.lineWidth = s * 0.3; c.strokeStyle = OUT; c.stroke();
  c.beginPath(); c.arc(x + s * 0.25, y + s * 0.05, s * 0.55, 0, TAU); c.fillStyle = '#111'; c.fill();
  c.beginPath(); c.arc(x + s * 0.42, y - s * 0.2, s * 0.2, 0, TAU); c.fillStyle = '#fff'; c.fill();
}
function smile(c, x, y, s, lw) {
  c.beginPath(); c.arc(x, y - s * 0.6, s, 0.15 * Math.PI, 0.85 * Math.PI);
  c.lineWidth = lw; c.strokeStyle = OUT; c.lineCap = 'round'; c.stroke();
}
function fluke(c, s, fill, r) {
  c.beginPath(); c.moveTo(s * 0.1, 0);
  c.quadraticCurveTo(-s * 0.15, -s * 0.1, -s * 0.4, -s * 0.38);
  c.quadraticCurveTo(-s * 0.28, 0, -s * 0.4, s * 0.38);
  c.quadraticCurveTo(-s * 0.15, s * 0.1, s * 0.1, 0);
  c.closePath(); fs(c, fill, r);
}

function drawFish(c, r, t, sp) {
  const col = sp.col, ry = r * (sp.slim ? 0.45 : 0.62), dark = shade(col, -0.18);
  c.lineJoin = 'round';
  c.save(); c.translate(-r * 0.85, 0); c.rotate(Math.sin(t * 9) * 0.28);
  c.beginPath(); c.moveTo(r * 0.15, 0); c.lineTo(-r * 0.55, -ry * 0.95);
  c.quadraticCurveTo(-r * 0.35, 0, -r * 0.55, ry * 0.95); c.closePath(); fs(c, dark, r);
  c.restore();
  c.beginPath(); c.moveTo(-r * 0.35, -ry * 0.75); c.quadraticCurveTo(-r * 0.05, -ry * 1.55, r * 0.3, -ry * 0.8); c.closePath(); fs(c, dark, r);
  c.beginPath(); c.ellipse(0, 0, r, ry, 0, 0, TAU); c.fillStyle = col; c.fill();
  if (sp.stripes) {
    c.save(); c.beginPath(); c.ellipse(0, 0, r, ry, 0, 0, TAU); c.clip();
    c.fillStyle = '#fff'; c.strokeStyle = OUT; c.lineWidth = r * 0.05;
    for (const sx of [0.32, -0.38]) { c.beginPath(); c.rect(r * sx - r * 0.11, -ry, r * 0.22, ry * 2); c.fill(); c.stroke(); }
    c.restore();
  }
  c.beginPath(); c.ellipse(r * 0.05, ry * 0.38, r * 0.6, ry * 0.32, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,.28)'; c.fill();
  c.beginPath(); c.ellipse(0, 0, r, ry, 0, 0, TAU); c.lineWidth = r * 0.07; c.strokeStyle = OUT; c.stroke();
  c.save(); c.translate(-r * 0.05, ry * 0.2); c.rotate(0.6 + Math.sin(t * 7) * 0.3);
  c.beginPath(); c.ellipse(-r * 0.12, 0, r * 0.22, ry * 0.16, 0, 0, TAU); fs(c, dark, r * 0.7); c.restore();
  eye(c, r * 0.5, -ry * 0.22, r * 0.17);
  smile(c, r * 0.72, ry * 0.22, r * 0.13, r * 0.05);
}

function drawPuffer(c, r, t, sp) {
  const col = sp.col, dark = shade(col, -0.25), br = r * 0.82;
  c.lineJoin = 'round';
  c.save(); c.translate(-br, 0); c.rotate(Math.sin(t * 9) * 0.3);
  c.beginPath(); c.moveTo(r * 0.1, 0); c.lineTo(-r * 0.35, -r * 0.3); c.lineTo(-r * 0.35, r * 0.3); c.closePath(); fs(c, dark, r);
  c.restore();
  c.beginPath();
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU;
    c.moveTo(Math.cos(a - 0.1) * br * 0.95, Math.sin(a - 0.1) * br * 0.95);
    c.lineTo(Math.cos(a) * br * 1.22, Math.sin(a) * br * 1.22);
    c.lineTo(Math.cos(a + 0.1) * br * 0.95, Math.sin(a + 0.1) * br * 0.95);
  }
  c.fillStyle = dark; c.fill(); c.lineWidth = r * 0.04; c.strokeStyle = OUT; c.stroke();
  c.beginPath(); c.arc(0, 0, br, 0, TAU); fs(c, col, r);
  c.beginPath(); c.ellipse(0, br * 0.4, br * 0.7, br * 0.4, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,.35)'; c.fill();
  c.fillStyle = dark;
  for (const [x, y] of [[-0.3, -0.4], [-0.5, 0], [0.05, -0.55], [-0.15, -0.1]]) { c.beginPath(); c.arc(br * x, br * y, br * 0.08, 0, TAU); c.fill(); }
  eye(c, br * 0.45, -br * 0.2, r * 0.2);
  c.beginPath(); c.arc(br * 0.85, br * 0.25, r * 0.08, 0, TAU); c.fillStyle = '#e57373'; c.fill();
  c.lineWidth = r * 0.04; c.strokeStyle = OUT; c.stroke();
}

function drawJelly(c, r, t, sp) {
  const col = sp.col, dark = shade(col, -0.2);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < 5; i++) {
    const x0 = -r * 0.5 + i * r * 0.25;
    c.beginPath(); c.moveTo(x0, r * 0.05);
    for (let k = 1; k <= 4; k++) c.lineTo(x0 + Math.sin(t * 4 + i + k) * r * 0.1, r * 0.05 + k * r * 0.27);
    c.lineWidth = r * 0.09; c.strokeStyle = dark; c.stroke();
  }
  const p = Math.sin(t * 3) * 0.06;
  c.save(); c.scale(1 - p, 1 + p);
  c.beginPath(); c.arc(0, 0, r * 0.8, Math.PI, 0);
  c.quadraticCurveTo(r * 0.4, r * 0.3, 0, r * 0.15); c.quadraticCurveTo(-r * 0.4, r * 0.3, -r * 0.8, 0);
  c.closePath(); fs(c, col, r);
  c.beginPath(); c.ellipse(-r * 0.3, -r * 0.45, r * 0.18, r * 0.1, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,.5)'; c.fill();
  eye(c, -r * 0.22, -r * 0.2, r * 0.13); eye(c, r * 0.22, -r * 0.2, r * 0.13);
  smile(c, 0, r * 0.02, r * 0.12, r * 0.05);
  c.restore();
}

function drawShrimp(c, r, t, sp) {
  const col = sp.col, dark = shade(col, -0.2);
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(r * 0.85, -r * 0.2); c.quadraticCurveTo(r * 1.3, -r * 0.9, r * 1.6, -r * 0.7 + Math.sin(t * 5) * r * 0.1);
  c.moveTo(r * 0.85, -r * 0.15); c.quadraticCurveTo(r * 1.4, -r * 0.5, r * 1.7, -r * 0.25);
  c.lineWidth = r * 0.05; c.strokeStyle = OUT; c.stroke();
  for (let i = 0; i < 4; i++) {
    const x = r * 0.5 - i * r * 0.3;
    c.beginPath(); c.moveTo(x, r * 0.2); c.lineTo(x - r * 0.05 + Math.sin(t * 12 + i) * r * 0.06, r * 0.5);
    c.lineWidth = r * 0.06; c.strokeStyle = dark; c.stroke();
  }
  c.beginPath(); c.moveTo(-r * 0.95, r * 0.1); c.lineTo(-r * 1.35, -r * 0.15); c.lineTo(-r * 1.3, r * 0.4); c.closePath(); fs(c, dark, r * 0.8);
  for (const [x, y, s] of [[-0.95, 0.1, 0.16], [-0.65, -0.05, 0.22], [-0.3, -0.12, 0.28], [0.08, -0.1, 0.33], [0.5, -0.05, 0.38]]) {
    c.beginPath(); c.arc(r * x, r * y, r * s, 0, TAU); fs(c, col, r * 0.8);
  }
  eye(c, r * 0.65, -r * 0.18, r * 0.12);
}

function drawTurtle(c, r, t, sp) {
  const shell = sp.col, skin = '#a5d6a7', dark = shade(shell, -0.3);
  const pad = Math.sin(t * 5) * 0.45;
  c.lineJoin = 'round';
  const flip = (x, y, rot, len) => {
    c.save(); c.translate(r * x, r * y); c.rotate(rot);
    c.beginPath(); c.ellipse(len * r * 0.5, 0, len * r * 0.5, r * 0.14, 0, 0, TAU); fs(c, skin, r); c.restore();
  };
  flip(0.3, -0.45, -0.9 + pad, 0.7); flip(-0.45, -0.4, -2.4 - pad * 0.6, 0.45);
  flip(0.3, 0.45, 0.9 - pad, 0.7);   flip(-0.45, 0.4, 2.4 + pad * 0.6, 0.45);
  c.beginPath(); c.moveTo(-r * 0.7, -r * 0.08); c.lineTo(-r * 1.0, 0); c.lineTo(-r * 0.7, r * 0.08); c.closePath(); fs(c, skin, r);
  c.beginPath(); c.ellipse(r * 0.88, 0, r * 0.3, r * 0.25, 0, 0, TAU); fs(c, skin, r);
  eye(c, r * 0.95, -r * 0.07, r * 0.1); smile(c, r * 1.03, r * 0.08, r * 0.08, r * 0.04);
  c.beginPath(); c.ellipse(0, 0, r * 0.8, r * 0.58, 0, 0, TAU); fs(c, shell, r);
  c.fillStyle = dark; c.globalAlpha = 0.55;
  const hex = (x, y, s) => { c.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s); } c.closePath(); c.fill(); };
  hex(0, 0, r * 0.2);
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + 0.5; hex(Math.cos(a) * r * 0.47, Math.sin(a) * r * 0.33, r * 0.12); }
  c.globalAlpha = 1;
  c.beginPath(); c.ellipse(-r * 0.15, -r * 0.32, r * 0.3, r * 0.09, -0.2, 0, TAU); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill();
}

function drawDolphin(c, r, t, sp) {
  const col = sp.col, dark = shade(col, -0.2);
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.save(); c.translate(-r * 1.0, -r * 0.03); c.rotate(Math.sin(t * 6) * 0.25); fluke(c, r * 0.9, dark, r); c.restore();
  c.beginPath(); c.moveTo(r * 0.05, -r * 0.4); c.quadraticCurveTo(-r * 0.15, -r * 0.65, -r * 0.4, -r * 0.8);
  c.quadraticCurveTo(-r * 0.35, -r * 0.5, -r * 0.5, -r * 0.33); c.closePath(); fs(c, dark, r);
  const body = () => {
    c.beginPath(); c.moveTo(r * 1.25, r * 0.06);
    c.quadraticCurveTo(r * 1.05, -r * 0.18, r * 0.65, -r * 0.33);
    c.quadraticCurveTo(-r * 0.3, -r * 0.52, -r * 1.05, -r * 0.05);
    c.quadraticCurveTo(-r * 0.3, r * 0.42, r * 0.6, r * 0.3);
    c.quadraticCurveTo(r * 1.0, r * 0.24, r * 1.25, r * 0.06); c.closePath();
  };
  body(); c.fillStyle = col; c.fill();
  c.save(); c.clip(); c.beginPath(); c.ellipse(r * 0.2, r * 0.32, r * 0.95, r * 0.2, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill(); c.restore();
  body(); c.lineWidth = r * 0.07; c.strokeStyle = OUT; c.stroke();
  c.save(); c.translate(r * 0.25, r * 0.28); c.rotate(0.5 + Math.sin(t * 6) * 0.2);

// ---------- Input ----------

// ---------- Update ----------
function updatePlayer(dt, z) {

function updateNPC(n, dt, z) {
  n.t += dt;
  const big = n.size >= player.size * EAT;
  const base = (big ? 55 : 95) * n.spd / z;
  n.ang += (Math.random() - 0.5) * dt * 2;

  n.x += n.vx * dt; n.y += n.vy * dt;

  n.tilt = SPECIES[n.key].kind === 'jelly' ? 0 : clamp(n.face * Math.atan2(n.vy, Math.abs(n.vx)), -0.5, 0.5);

function collide() {

function sparks(x, y, count, r) {

    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.7, max: 0.7, r, type: 'spark', col: pick(['#fff59d', '#ffffff', '#b9f6ca', '#ffcc80', '#f8bbd0']) });
  }
}

function eat(n) {

  const sp = SPECIES[n.key];
  sparks(n.x, n.y, 8, n.size * 0.22 + player.size * 0.04);
  addText(n.x, n.y - n.size, pick(YUM), sp.name, '#fff59d');
  sfx.eat(n.size / player.size);
  if (!found.has(n.key)) discover(n.key, true);
  const st = STAGES[player.stage];
  if (player.stage < STAGES.length - 1) {
    if (player.size >= st.base * 2) { player.size = st.base * 2; startEvolve(); }
  } else if (player.size >= MAX_SIZE) { player.size = MAX_SIZE; doWin(); }
  updateHUD();
}

function bump(n) {

  player.vx = dx / d * f; player.vy = dy / d * f; player.inv = 1.3;
  n.vx -= dx / d * f * 0.2; n.vy -= dy / d * f * 0.2;
  addText(player.x, player.y - player.size, 'Oops!', 'Too big!', '#ffe082');
  sfx.bump();
}

function addText(wx, wy, txt, sub, col) { texts.push({ wx, wy, txt, sub, col, life: 1.4, max: 1.4 }); if (texts.length > 6) texts.shift(); }

function update(dt) {
  time += dt;
  const z = zoomFor(player.stage);
  cam.zoom += (z - cam.zoom) * Math.min(1, dt * 2.5);
  if (state === 'play') updatePlayer(dt, z);
  graceT = Math.max(0, graceT - dt);
  const hw = W / 2 / cam.zoom, hh = H / 2 / cam.zoom;
  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i]; updateNPC(n, dt, z);
    const dx = Math.abs(n.x - cam.x), dy = Math.abs(n.y - cam.y);
    const far = dx > hw * 2.2 + n.size * 3 || dy > hh * 2.2 + n.size * 3;
    const tinyOff = n.size < player.size * 0.15 && (dx > hw + n.size * 2 || dy > hh + n.size * 2);
    if (far || tinyOff) npcs.splice(i, 1);

  if (state === 'play') collide();

  if (state === 'win') { winT -= dt; if (winT <= 0) { winT = 0.35; sparks(player.x + rand(-1, 1) * player.size * 2, player.y + rand(-1, 1) * player.size * 1.5, 10, player.size * 0.12); } }

    if (p.type === 'spark') { p.vx *= 0.92; p.vy *= 0.92; } else p.x += Math.sin(time * 4 + p.r) * 0.3 / cam.zoom;
  }

// ---------- Render ----------

    if (t.sub) {

      ctx.strokeText(t.sub, x, y + f1 * 0.95); ctx.fillStyle = '#fff'; ctx.fillText(t.sub, x, y + f1 * 0.95);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- UI ----------
let lastHudStage = -1, toastTimer = 0;
function updateHUD() {
  const st = STAGES[player.stage], name = SPECIES[st.sp].name;
  const top = player.stage < STAGES.length - 1 ? st.base * 2 : MAX_SIZE;
  $('fill').style.width = (clamp((player.size - st.base) / (top - st.base), 0, 1) * 100).toFixed(1) + '%';
  if (lastHudStage !== player.stage) {
    lastHudStage = player.stage;
    $('stageName').textContent = name; $('stageName').dataset.say = 'You are a ' + name;
    renderIcon($('curIcon'), st.sp, false);
    const last = player.stage === STAGES.length - 1;
    $('nextIcon').classList.toggle('hidden', last); $('trophy').classList.toggle('hidden', !last);
    if (!last) renderIcon($('nextIcon'), STAGES[player.stage + 1].sp, true);
  }
}
function discover(key, toast) {
  const isNew = !found.has(key);
  found.add(key); store.set('gfg_found', [...found]);
  if (toast && isNew) {
    const name = SPECIES[key].name;
    renderIcon($('toastIcon'), key, false);
    $('toastText').textContent = 'New! ' + name; $('toast').dataset.say = 'New! ' + name;
    $('toast').classList.remove('hide'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.add('hide'), 2800);
    sfx.newOne(); if (readOn) say('New! ' + name);
  }
}
function hideAll() { ['title', 'evolve', 'win', 'book'].forEach(id => $(id).classList.add('hidden')); }
function show(id) { hideAll(); $(id).classList.remove('hidden'); }

function startEvolve() {
  state = 'evolve'; sfx.evolve();
  sparks(player.x, player.y, 18, player.size * 0.15);
  const next = STAGES[player.stage + 1].sp, name = SPECIES[next].name;
  renderIcon($('evoArt'), next, false);
  setSentence($('evoText'), 'You are a ' + name + '!');
  setTimeout(() => { if (state === 'evolve') { show('evolve'); if (readOn) say('You grew! You are a ' + name + '!'); } }, 500);
}
function finishEvolve() {
  player.stage++; store.set('gfg_stage', player.stage);
  discover(STAGES[player.stage].sp, false);
  graceT = 4; player.inv = 1;
  npcs = npcs.filter(n => n.size >= player.size * 0.2);
  hideAll(); state = 'play'; updateHUD();
}
function doWin() {
  state = 'win'; winT = 0; sfx.win(); store.set('gfg_stage', 0);
  renderIcon($('winArt'), 'whale', false);
  setTimeout(() => { if (state === 'win') { show('win'); if (readOn) say('You did it! You are the biggest in the sea!'); } }, 900);
}
function openBook(from) {
  prevState = from; state = 'book';
  const grid = $('grid'); grid.innerHTML = '';
  for (const key of BOOK) {
    const has = found.has(key), d = document.createElement('div');
    d.className = 'card' + (has ? ' say' : ' locked'); if (has) d.dataset.say = SPECIES[key].name;
    const c = document.createElement('canvas'); c.width = 200; c.height = 130; renderIcon(c, key, !has);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = has ? SPECIES[key].name : '?';
    d.append(c, lab); grid.append(d);
  }
  setSentence($('bookCount'), `You found ${[...found].filter(k => SPECIES[k]).length} of ${BOOK.length}!`);
  show('book');
}
function closeBook() {
  hideAll(); state = prevState;
  if (state === 'title') showTitle();
  else if (state === 'win') show('win');
}
function showTitle() {
  state = 'title'; $('hud').classList.add('hidden'); show('title');
  const saved = store.get('gfg_stage', 0);
  $('newBtn').classList.toggle('hidden', !saved);
  $('playBtn').textContent = saved ? 'Keep going' : 'Play';
  const c = $('titleArt').getContext('2d'); c.clearRect(0, 0, 420, 220);
  c.save(); c.translate(160, 115); drawSpecies(c, 'clownfish', 62, 0.5); c.restore();
  c.save(); c.translate(330, 90);
  c.beginPath(); c.arc(0, 0, 32, 0, TAU); c.fillStyle = 'rgba(140,255,150,.3)'; c.fill(); c.lineWidth = 3; c.strokeStyle = 'rgba(100,230,120,.9)'; c.stroke();
  drawSpecies(c, 'minnow', 24, 1); c.restore();
  c.strokeStyle = 'rgba(80,160,220,.6)'; c.lineWidth = 3;
  for (const [x, y, r] of [[60, 60, 8], [80, 35, 5], [370, 170, 7], [250, 40, 4]]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); }
}
function goFull() { const el = document.documentElement; try { if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); } catch (e) {} }

$('playBtn').onclick = () => { ensureAudio(); goFull(); startGame(store.get('gfg_stage', 0)); };
$('newBtn').onclick = () => { ensureAudio(); goFull(); store.set('gfg_stage', 0); startGame(0); };
$('bookBtn').onclick = () => openBook('title');
$('winBookBtn').onclick = () => openBook('win');
$('bBook').onclick = () => { if (state === 'play') openBook('play'); };
$('backBtn').onclick = closeBook;
$('goBtn').onclick = finishEvolve;
$('againBtn').onclick = () => { startGame(0); };
function syncToggles() { $('bSound').textContent = soundOn ? '🔊' : '🔇'; $('bRead').classList.toggle('off', !readOn); }
$('bSound').onclick = () => { soundOn = !soundOn; store.set('gfg_sound', soundOn); syncToggles(); ensureAudio(); };
$('bRead').onclick = () => { readOn = !readOn; store.set('gfg_read', readOn); syncToggles(); say(readOn ? 'I will read to you.' : ''); };
syncToggles();
document.addEventListener('visibilitychange', () => { if (document.hidden && 'speechSynthesis' in window) speechSynthesis.cancel(); });

// ---------- Go ----------
showTitle();
for (let i = 0; i < 14; i++) spawnNPC(true);
function frame(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { icon(size) { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#6fd3f7'); g.addColorStop(1, '#0d4a86'); x.fillStyle = g; x.fillRect(0, 0, size, size);
    x.translate(size * 0.56, size * 0.52); drawSpecies(x, 'clownfish', size * 0.3, 0.5); return c.toDataURL('image/png'); }, player, npcs: () => npcs, startGame, get state() { return state; }, eatAll() { for (const n of npcs) if (n.size < player.size * EAT) { n.x = player.x; n.y = player.y; } } };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
